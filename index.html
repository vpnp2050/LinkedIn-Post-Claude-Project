<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>LinkedIn Post & Image Generator</title>
</head>
<body>
    <div class="container">
        <h1>LinkedIn Post & Image Generator</h1>
        <textarea id="postContent" placeholder="Write your LinkedIn post here..."></textarea>
        <button id="generateImageBtn">Generate Image</button>
        <button id="generatePostBtn">Generate Post</button>
        <div id="outputSection">
            <img id="generatedImage" src="" alt="Generated Image" style="display: none;" />
            <div id="generatedPost" style="display: none;"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
